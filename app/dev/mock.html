<!DOCTYPE html>
<!--
  DEV ONLY — renders app/src/index.html's UI against a fake backend (mock.js)
  so it can be checked in any browser without Tauri, the daemon or AirPods.
  Usage:
    python3 -m http.server -d app 8765
    open http://localhost:8765/dev/mock.html?scenario=pro2
  Scenarios: pro2, max, disconnected, absent, starting, editor, eq-waiting, eq-error,
  mic-streaming, mic-unavailable, mic-error
  (append &settings=open to expand Settings).
  The markup is loaded from ../src/index.html at runtime (body.js), so this
  page never drifts from the real one.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>AirPods Helper (mock)</title>
  <link rel="stylesheet" href="../src/style.css">
</head>
<body>
  <script src="mock.js"></script>
  <script src="body.js"></script>
  <script src="../src/eq.js"></script>
  <script src="../src/main.js"></script>
</body>
</html>
