[workspace]
members = ["aap", "daemon", "cli"]
# windows/ is excluded from the workspace because it depends on Windows-specific
# crates (windows-rs, btleplug WinRT backend) that cannot build on Linux.
# On a Windows dev machine, either:
#   1. Build it standalone: cd windows && cargo build
#   2. Or add "windows" to members above and remove it from exclude.
# app/src-tauri is its own workspace (it needs webkit2gtk to build).
exclude = ["windows", "app/src-tauri"]
resolver = "3"

# One version for the three workspace crates; packaging scripts read it from here.
[workspace.package]
version = "0.3.0"
edition = "2024"

# Shared deps are declared once so every member asks for the same versions.
# Members add features on top; cargo unifies them across the workspace build.
[workspace.dependencies]
aap = { path = "aap" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
tracing = "0.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Deps are rarely stepped through in a debugger, so dropping their debug info
# shrinks target/debug and speeds up linking. Our own crates keep full debuginfo.
[profile.dev.package."*"]
debug = false

# Local release builds. Thin LTO with parallel codegen: measured
# on this repo (2026-10-06, 6 jobs) a daemon-only rebuild takes 11.3s vs 26.9s with
# fat LTO + codegen-units=1, at the cost of a bigger binary (4.6 MB vs 3.2 MB).
[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"

# Shipped packages (deb, tarball, PKGBUILD, CI artifacts): smallest binary.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
