[package]
name = "airpods-daemon"
version = "0.3.0-rc.1"
edition = "2024"

[dependencies]
aap = { path = "../aap" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process", "signal", "io-util"] }
bluer = { version = "0.17", features = ["l2cap", "bluetoothd"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
thiserror = "2"
anyhow = "1.0.102"
futures = "0.3.32"
serde_json = "1"
toml_edit = "0.22"

