name: Tauri AppImage

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'app/**'
      - 'daemon/**'
      - 'aap/**'
      - 'cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/appimage/**'
      - 'packaging/build-appimage.sh'
      - '.github/workflows/appimage.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libcap-dev libfuse2 patchelf desktop-file-utils dbus-x11 xvfb bubblewrap xdg-dbus-proxy
      - uses: dtolnay/rust-toolchain@stable
      - name: Get AppImage packaging tools
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl -fL https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o "$RUNNER_TEMP/appimage-tools/linuxdeploy"
          curl -fL https://raw.githubusercontent.com/tauri-apps/tauri/dev/crates/tauri-bundler/src/bundle/linux/appimage/linuxdeploy-plugin-gtk.sh -o "$RUNNER_TEMP/appimage-tools/linuxdeploy-plugin-gtk.sh"
          chmod +x "$RUNNER_TEMP/appimage-tools/"*
          echo "$RUNNER_TEMP/appimage-tools" >> "$GITHUB_PATH"
      - name: Check installer
        run: |
          bash -n packaging/appimage/*.sh packaging/appimage/AppRun packaging/build-appimage.sh
          python3 packaging/appimage/test_install.py
          node --check app/src/main.js
          node --check app/src/panel.js
          node --test app/tests/*.test.cjs
      - name: Verify tag matches bundled version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$RELEASE_TAG" = "v$version"
      - name: Build AppImage and update metadata
        run: bash packaging/build-appimage.sh
      - name: Smoke-test the bundle without activating a daemon
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          status=0
          xvfb-run -a dbus-run-session --config-file=kde/tests/session.conf -- \
            timeout --kill-after=2 8 packaging/appimage-build/AirPods_Helper-x86_64.AppImage \
            --appimage-extract-and-run > smoke.log 2>&1 || status=$?
          cat smoke.log
          test "$status" -eq 124
      - name: Generate checksum
        working-directory: packaging/appimage-build
        run: sha256sum AirPods_Helper-x86_64.AppImage > AirPods_Helper-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AirPods-Helper-AppImage
          path: |
            packaging/appimage-build/AirPods_Helper-x86_64.AppImage
            packaging/appimage-build/AirPods_Helper-x86_64.AppImage.zsync
            packaging/appimage-build/AirPods_Helper-x86_64.AppImage.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AirPods-Helper-AppImage
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*
